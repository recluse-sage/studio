name: browser-pass

# Phase 1 browser pass evidence. Manual plus registry-scoped PR runs only.
# Proof modes (two, split by environment):
# - CI owns the negative proof: an unauthenticated run hits the Access gate
#   (403 Forbidden HTML, zero rows) and the story verdict is PASS with reason
#   gate-negative-proof. That proves visitors get nothing, which is the
#   required security posture. The run exits 0 and PNGs keep the
#   -gate-blocked suffix (it is accurate).
# - Humans own the signed-in visual pass: with an Access session rows render
#   and the full battery must all pass. Any check failure fails the run.
# Isolation notes:
# - Fixture-backed handler only. Seed and offline stories never touch the network API.
# - No database writes. The script only reads rendered rows and localStorage theme.
# - No credentials. No Cloudflare account access. No secrets are referenced here.
# - Local wrangler dev only. No --remote flag. No deploy step anywhere in this file.
# - If /admin/* HTML returns 403 locally, the story verdict is PASS
#   (gate-negative-proof) and the summary names the gate with the reason
#   inline. Signed-in visual confirmation stays a human step.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/routes/admin-registry.tsx"
      - "app/routes/admin.tsx"
      - "src/features/admin/**"
      - "src/server/handlers/registry.ts"
      - "scripts/ci/browser-pass.mjs"
      - ".github/workflows/browser-pass.yml"

concurrency:
  group: browser-pass-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-pass:
    name: browser-pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        # Playwright is installed with --no-save so package.json stays untouched.
        # Pinned to an exact version so CI browsers are reproducible.
        # Chromium-only rule: agents never use system Chrome. CI uses the
        # Playwright bundled Chromium pinned here, installed by the matching
        # `npx playwright install` below (same package version, so same browser build).
        # The browser install includes system deps for the GitHub runner.
        run: |
          npm install --no-save playwright@1.65.1
          npx playwright install --with-deps chromium

      - name: Start wrangler dev locally
        # Assumed flags and port for the first real run to confirm:
        # --local serves D1 and assets locally, --port 8787, --ip 127.0.0.1.
        # No --remote flag, no account, no token. Log kept for the artifact.
        run: |
          npx wrangler dev --local --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          echo $! > wrangler.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8787/ > /dev/null; then
              echo "wrangler dev is up"
              exit 0
            fi
            sleep 2
          done
          echo "wrangler dev did not start in time"
          cat wrangler.log || true
          exit 1

      - name: Run registry browser pass
        env:
          BROWSER_PASS_BASE_URL: http://127.0.0.1:8787
          BROWSER_PASS_OUT_DIR: browser-pass-results
        run: node scripts/ci/browser-pass.mjs

      - name: Write step summary
        if: always()
        run: |
          if [ -f browser-pass-results/summary.md ]; then
            cat browser-pass-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Browser pass produced no summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-pass-evidence
          path: |
            browser-pass-results/
            wrangler.log
          if-no-files-found: warn

      - name: Stop wrangler dev
        if: always()
        run: |
          if [ -f wrangler.pid ]; then
            kill "$(cat wrangler.pid)" || true
          fi
